name: ESPHome compile

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: pip install --upgrade esphome

      - name: Validate configuration
        run: esphome config examples/minimal.yaml

      - name: Compile
        run: esphome compile examples/minimal.yaml
