esphome:
  name: m5papermono-lite-test
  friendly_name: M5PaperMono Lite Test

packages:
  m5papermono_lite:
    url: https://github.com/CitizenRacer/M5PaperMonoLite
    ref: main
    file: packages/m5papermono-lite.yaml
    refresh: 1d

logger:

# Render ESPHome's built-in display test card for first hardware bring-up.
display:
  - id: m5_display
    show_test_card: true

# The package is hardware-only; add wifi/api/ota here for a real installation.
#
# wifi:
#   ssid: !secret wifi_ssid
#   password: !secret wifi_password
#
# api:
# ota:
#   - platform: esphome
